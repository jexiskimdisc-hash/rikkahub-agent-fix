name: Build fixed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Select universal APK
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print
          universal=$(find app/build/outputs/apk -type f -name '*universal*.apk' | head -n 1)
          test -n "$universal"
          cp "$universal" rikkahub-agent-fixed-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-fixed-universal-apk
          path: rikkahub-agent-fixed-universal.apk
          if-no-files-found: error
          retention-days: 14
